name: docmind
description: "DocMind — offline document scanner, OCR and PDF toolkit."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  google_mlkit_barcode_scanning: ^0.16.1
  google_mlkit_text_recognition: ^0.17.1
  syncfusion_flutter_pdf: ^35.1.40+1
  pdfrx: ^2.6.5
  image: ^4.12.0
  provider: ^6.1.5+1
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^13.3.1
  printing: ^5.15.1
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  archive: ^4.5.2
  local_auth: ^3.0.2
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  intl: ^0.20.3
  open_filex: ^5.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Manrope (SIL OFL 1.1) — see assets/fonts/MANROPE_OFL.txt
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    # Phosphor Icons (MIT) — see assets/fonts/PHOSPHOR_LICENSE.txt
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorDuotone
      fonts:
        - asset: assets/fonts/Phosphor-Duotone.ttf
